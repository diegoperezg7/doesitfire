name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Paste the error message.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: doesitfire.yaml
      description: Remove anything private. Never paste API keys.
      render: yaml
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `doesitfire --version`, `docker version --format '{{.Server.Version}}'` and your OS.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: results.json (optional)
      description: Attach it if the problem is about a wrong activation count.
