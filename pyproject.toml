[project]
name = "doesitfire"
version = "0.1.2"
description = "Does your SKILL.md actually fire? Test skill activation in Claude Code, Codex and OpenCode with one command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Pérez" }]
requires-python = ">=3.11"
keywords = ["agent-skills", "skill-md", "claude-code", "codex", "opencode", "evaluation", "llm", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openai==3.42.1",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "typer==0.27.3",
]

[project.urls]
Homepage = "https://github.com/diegoperezg7/doesitfire"
Repository = "https://github.com/diegoperezg7/doesitfire"
Issues = "https://github.com/diegoperezg7/doesitfire/issues"
Changelog = "https://github.com/diegoperezg7/doesitfire/blob/main/CHANGELOG.md"

[project.scripts]
doesitfire = "doesitfire.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doesitfire"]

[tool.hatch.build.targets.sdist]
include = ["src/doesitfire", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (run on Linux CI only)"]
addopts = "-m 'not docker'"

[tool.ruff]
line-length = 120
extend-exclude = ["scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
